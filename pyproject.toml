[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-uptime-monitor"
version = "0.1.0"
description = "Production-grade uptime monitoring service"
requires-python = ">=3.11"
dependencies = [
    "Django==5.0.6",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "django-cors-headers==4.4.0",
    "django-filter==24.2",
    "drf-spectacular==0.27.2",
    "channels==4.1.0",
    "channels-redis==4.2.0",
    "celery==5.4.0",
    "django-celery-beat==2.6.0",
    "redis==5.0.7",
    "kombu==5.3.4",
    "psycopg[binary]==3.1.19",
    "httpx==0.27.0",
    "django-encrypted-model-fields==0.6.5",
    "cryptography==43.0.0",
    "prometheus-client==0.20.0",
    "sentry-sdk==2.13.0",
    "python-decouple==3.8",
    "python-slugify==8.0.4",
    "whitenoise==6.7.0",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*"]

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments
    "N806",  # Variable in function should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "monitors", "checks", "incidents", "notifications", "dashboard", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--reuse-db",
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "locustfile.py",
    "config/wsgi.py",
    "config/asgi.py",
    "config/settings/*",
    "*/management/*",
    ".venv/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false

# ─── Pyrefly (VS Code type checker) ──────────────────────────────────────────
[tool.pyrefly]
# Point Pyrefly at the project virtualenv so it finds django, celery, etc.
# Create the venv first:  python -m venv .venv && .venv\Scripts\pip install -r requirements\local.txt
python_interpreter = ".venv/Scripts/python.exe"
