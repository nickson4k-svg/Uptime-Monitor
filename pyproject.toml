[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pet-uptime-monitor"
version = "0.1.0"
description = "Production-grade uptime monitoring service"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*"]

# ─── Dependencies ────────────────────────────────────────────────────────────
[project.dependencies]
# leaving empty — use requirements files below

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments
    "N806",  # Variable in function should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "monitors", "checks", "incidents", "notifications", "dashboard", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--reuse-db",
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/settings/*",
    ".venv/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

# ─── Pyrefly (VS Code type checker) ──────────────────────────────────────────
[tool.pyrefly]
# Point Pyrefly at the project virtualenv so it finds django, celery, etc.
# Create the venv first:  python -m venv .venv && .venv\Scripts\pip install -r requirements\local.txt
python_interpreter = ".venv/Scripts/python.exe"
